name: Supply Chain Alpha CI Pipeline

on:
  push:
    branches: [ "main", "feature/final-integration" ]
  pull_request:
    branches: [ "main" ]

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code Repository
        uses: actions/checkout@v4

      - name: Setup Node.js Environment
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install Node Dependencies
        working-directory: backend/node-api
        run: npm ci

      - name: Start Node API
        working-directory: backend/node-api
        run: |
          node server.js &
          echo $! > server.pid
          sleep 3

      - name: Run API Integration Tests
        working-directory: backend/node-api
        run: npm test

      - name: Setup Python Environment
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Execute AI Simulator Integration Test
        run: python backend/python-service/Simulator_v2.py